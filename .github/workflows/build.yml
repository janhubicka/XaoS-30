name: XaoS-30 build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        sanitizer: [none, address]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build qt6-base-dev libgmp-dev
      - run: >-
          cmake -S experimental/qt-modern -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DXAOS_SANITIZE=${{ matrix.sanitizer == 'address' && 'ON' || 'OFF' }}
      - run: cmake --build build -j 2
      - run: ctest --test-dir build --output-on-failure
      - name: Qt offscreen render/resize/cancel/shutdown smoke test
        run: QT_QPA_PLATFORM=offscreen ASAN_OPTIONS=detect_leaks=0 ./build/xaos-modern --smoke-test
  thread-sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgmp-dev
      - run: cmake -S experimental/qt-modern -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DXAOS_BUILD_GUI=OFF -DXAOS_TSAN=ON
      - run: cmake --build build -j 2
      - run: ctest --test-dir build --output-on-failure
