name: XaoS-30 build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xaos-30-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  qt-linux:
    name: Qt Linux (${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [none, address]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build qt6-base-dev libgmp-dev
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
          -DXAOS_SANITIZE=${{ matrix.sanitizer == 'address' && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build build
      - name: Core tests
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure
      - name: Qt desktop and phone UI smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          ./build/xaos-modern --smoke-test
          ./build/xaos-modern --smoke-test --mobile-ui


  thread-sanitizer:
    name: ThreadSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgmp-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON -DXAOS_BUILD_GUI=OFF -DXAOS_TSAN=ON
      - name: Build
        run: cmake --build build
      - name: Core tests
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  macos-binaries:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install ninja qt gmp
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DCMAKE_CXX_FLAGS="-fexperimental-library" \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" \
            -DGMP_INCLUDE_DIR="$(brew --prefix gmp)/include" \
            -DGMP_LIBRARY="$(brew --prefix gmp)/lib/libgmp.dylib"
      - name: Build
        run: cmake --build build
      - name: Core tests
        run: ctest --test-dir build --output-on-failure
      - name: Install app bundle
        run: cmake --install build --prefix package
      - name: Deploy Qt and GMP
        run: |
          set -euo pipefail
          app="package/xaos-modern.app"
          "$(brew --prefix qt)/bin/macdeployqt" "$app" -always-overwrite

          executable="$app/Contents/MacOS/xaos-modern"
          frameworks="$app/Contents/Frameworks"
          mkdir -p "$frameworks"
          gmp_link="$(otool -L "$executable" | awk '/libgmp/{print $1; exit}')"
          test -n "$gmp_link"
          gmp_name="$(basename "$gmp_link")"
          case "$gmp_link" in
            @executable_path/*|@rpath/*)
              test -f "$frameworks/$gmp_name"
              ;;
            *)
              cp "$gmp_link" "$frameworks/$gmp_name"
              chmod 755 "$frameworks/$gmp_name"
              install_name_tool -id "@rpath/$gmp_name" "$frameworks/$gmp_name"
              install_name_tool -change "$gmp_link" "@executable_path/../Frameworks/$gmp_name" "$executable"
              ;;
          esac

          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          if otool -L "$executable" | grep -E '/opt/homebrew|/usr/local/(opt|Cellar)'; then
            echo "App bundle still references Homebrew libraries"
            exit 1
          fi
      - name: Archive app bundle
        run: tar -czf "XaoS-30-macos-${{ matrix.arch }}.tar.gz" -C package xaos-modern.app
      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: XaoS-30-macos-${{ matrix.arch }}
          path: XaoS-30-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  windows-binaries:
    name: Windows x86_64
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-gmp
      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        shell: msys2 {0}
        run: cmake --build build
      - name: Core tests
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure
      - name: Install and deploy
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake --install build --prefix package
          windeployqt6 --release --no-translations package/bin/xaos-modern.exe
          cp /ucrt64/bin/libgmp-10.dll package/bin/
      - name: Packaged GUI smoke test
        shell: pwsh
        run: .\package\bin\xaos-modern.exe --smoke-test
      - name: Archive Windows binaries
        shell: pwsh
        run: Compress-Archive -Path package\bin\* -DestinationPath XaoS-30-windows-x86_64.zip
      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: XaoS-30-windows-x86_64
          path: XaoS-30-windows-x86_64.zip
          if-no-files-found: error

  android-apk:
    name: Android arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install host build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build autoconf automake libtool m4 xz-utils
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
      - name: Install Android platform and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: all_os
          target: android
          arch: android_arm64_v8a
          modules: qtsensors
          cache: true
          extra: --autodesktop
      - name: Build GMP for Android arm64
        run: |
          set -euo pipefail
          gmp_archive=gmp-6.3.0.tar.xz
          gmp_sha256=a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898
          for url in \
            "https://ftp.gnu.org/gnu/gmp/$gmp_archive" \
            "https://ftpmirror.gnu.org/gmp/$gmp_archive" \
            "https://gmplib.org/download/gmp/$gmp_archive"
          do
            echo "Downloading GMP from $url"
            if curl --fail --location --show-error \
                    --connect-timeout 20 --max-time 180 \
                    --retry 2 --retry-all-errors \
                    "$url" -o "$gmp_archive"; then
              break
            fi
            rm -f "$gmp_archive"
          done
          test -s "$gmp_archive"
          echo "$gmp_sha256  $gmp_archive" | sha256sum --check -
          tar -xf "$gmp_archive"
          toolchain="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
          prefix="$GITHUB_WORKSPACE/gmp-android"
          cd gmp-6.3.0
          CC="$toolchain/bin/aarch64-linux-android28-clang" \
          AR="$toolchain/bin/llvm-ar" \
          RANLIB="$toolchain/bin/llvm-ranlib" \
          STRIP="$toolchain/bin/llvm-strip" \
          ./configure --host=aarch64-linux-android --prefix="$prefix" \
            --disable-shared --enable-static --with-pic --disable-assembly
          make -j2
          make install
      - name: Configure Android app
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DQT_ANDROID_BUILD_ALL_ABIS=OFF \
            -DQT_ANDROID_DEPLOYMENT_TYPE=Debug \
            -DGMP_INCLUDE_DIR="$GITHUB_WORKSPACE/gmp-android/include" \
            -DGMP_LIBRARY="$GITHUB_WORKSPACE/gmp-android/lib/libgmp.a"
      - name: Build APK
        run: cmake --build build-android --target apk
      - name: Collect Android installer
        run: |
          set -euo pipefail
          apk="$(find build-android -type f -name '*.apk' | head -n1)"
          test -n "$apk"
          cp "$apk" XaoS-30-android-arm64-v8a.apk
          ls -lh XaoS-30-android-arm64-v8a.apk
      - name: Upload Android installer
        uses: actions/upload-artifact@v4
        with:
          name: XaoS-30-android-arm64-v8a
          path: XaoS-30-android-arm64-v8a.apk
          if-no-files-found: error

  publish-release:
    name: Publish development binaries
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - qt-linux
      - thread-sanitizer
      - macos-binaries
      - windows-binaries
      - android-apk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download platform binaries
        uses: actions/download-artifact@v4
        with:
          pattern: XaoS-30-*
          path: release-assets
          merge-multiple: true

      - name: Verify release payload
        run: |
          set -euo pipefail
          test -f release-assets/XaoS-30-windows-x86_64.zip
          test -f release-assets/XaoS-30-macos-arm64.tar.gz
          test -f release-assets/XaoS-30-macos-x86_64.tar.gz
          test -f release-assets/XaoS-30-android-arm64-v8a.apk
          (cd release-assets && sha256sum \
            XaoS-30-windows-x86_64.zip \
            XaoS-30-macos-arm64.tar.gz \
            XaoS-30-macos-x86_64.tar.gz \
            XaoS-30-android-arm64-v8a.apk > SHA256SUMS)
          ls -lh release-assets

      - name: Publish rolling development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=android-latest

          # Preserve the existing stable release URL while broadening it to all
          # distributable platforms. Move the tag to the successful main commit.
          git tag -f "$tag" "$GITHUB_SHA"
          git push --force origin "refs/tags/$tag"

          notes="Latest successful development build from main commit $GITHUB_SHA.

          Release assets:
          - Windows x86_64 ZIP
          - macOS arm64 app bundle
          - macOS x86_64 app bundle
          - Android arm64-v8a debug-signed APK
          - SHA256SUMS

          These files are replaced automatically after every fully successful main build."

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
            gh release edit "$tag" \
              --title "XaoS-30 development build" \
              --notes "$notes" \
              --prerelease
          else
            gh release create "$tag" release-assets/* \
              --title "XaoS-30 development build" \
              --notes "$notes" \
              --prerelease
          fi
